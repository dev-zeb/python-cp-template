name: Run Examples Script

on:
  push:
    branches: 
    - main
  pull_request:
    branches:
    - main

jobs:
  run-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install package
        run: pip install -r requirements.txt

      - name: Run example files
        run: |
          python examples/dp_examples.py
          python examples/heap_examples.py
          python examples/tree_examples.py
          python examples/graph_examples.py
    
